<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kodelab — Belajar HTML, CSS &amp; JavaScript</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
@import url('https://cdnjs.cloudflare.com/ajax/libs/JetBrains-Mono/2.304/jetbrains-mono.css');

:root{
  --ink: #14161c;
  --panel: #1c1f27;
  --panel-2: #23262f;
  --line: #333747;
  --paper: #f4f2ec;
  --paper-dim: #b9b6ac;
  --amber: #e8b44c;
  --amber-dim: #a9853c;
  --teal: #6fb7a8;
  --red: #d9695f;
  --text: #e8e6df;
  --text-dim: #9a9da6;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-serif: 'Source Serif 4', Georgia, serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
}

/* ---------- Layout shell ---------- */
.app{
  display:grid;
  grid-template-columns: 280px 1fr;
  height:100vh;
}
.overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; }
.overlay.show{ display:block; }

@media (max-width: 860px){
  .app{ grid-template-columns: 1fr; }
  .sidebar{ position:fixed; z-index:50; top:0; left:0; bottom:0; width:280px; transform:translateX(-100%); transition:transform .25s ease; }
  .sidebar.open{ transform:translateX(0); }
  .menu-btn{ display:inline-flex !important; }
}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.brand-mark{
  font-family:var(--font-mono);
  font-size:20px;
  font-weight:700;
  color:var(--paper);
  letter-spacing:-0.02em;
}
.brand-mark span{ color:var(--amber); }
.brand-sub{
  margin-top:4px;
  font-size:12.5px;
  color:var(--text-dim);
}
.progress-wrap{
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.progress-label{
  display:flex;
  justify-content:space-between;
  font-size:11.5px;
  color:var(--text-dim);
  margin-bottom:6px;
}
.progress-track{
  height:5px;
  background:var(--panel-2);
  border-radius:3px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--amber);
  border-radius:3px;
  transition:width .4s ease;
}
.nav{
  flex:1;
  overflow-y:auto;
  padding:10px 10px 20px;
}
.nav::-webkit-scrollbar{ width:6px; }
.nav::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

.track-group{ margin-bottom:6px; }
.track-head{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  background:none;
  border:none;
  color:var(--text);
  font-family:var(--font-ui);
  font-size:13.5px;
  font-weight:600;
  padding:10px 10px;
  cursor:pointer;
  border-radius:6px;
  text-align:left;
}
.track-head:hover{ background:var(--panel-2); }
.track-dot{
  width:8px; height:8px; border-radius:50%;
  flex-shrink:0;
}
.track-count{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-dim);
}
.track-chev{
  font-size:11px;
  color:var(--text-dim);
  transition:transform .2s;
  width:12px;
}
.track-group.open .track-chev{ transform:rotate(90deg); }

.lesson-list{
  display:none;
  padding:2px 0 6px 26px;
  border-left:1px solid var(--line);
  margin-left:15px;
}
.track-group.open .lesson-list{ display:block; }

.lesson-item{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  background:none;
  border:none;
  color:var(--text-dim);
  font-family:var(--font-ui);
  font-size:13px;
  padding:7px 10px;
  cursor:pointer;
  border-radius:5px;
  text-align:left;
  line-height:1.3;
}
.lesson-item:hover{ background:var(--panel-2); color:var(--text); }
.lesson-item.active{
  background:rgba(232,180,76,0.12);
  color:var(--amber);
  font-weight:600;
}
.lesson-check{
  width:14px; height:14px;
  border-radius:50%;
  border:1.5px solid var(--line);
  flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:9px;
}
.lesson-item.done .lesson-check{
  background:var(--teal);
  border-color:var(--teal);
  color:var(--ink);
}

/* ---------- Main ---------- */
.main{
  overflow-y:auto;
  height:100vh;
  position:relative;
}
.topbar{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:14px;
  padding:14px 28px;
  background:rgba(20,22,28,0.9);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.menu-btn{
  display:none;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--text);
  width:34px; height:34px;
  border-radius:6px;
  align-items:center; justify-content:center;
  cursor:pointer;
  font-size:15px;
  flex-shrink:0;
}
.crumb{
  font-size:13px;
  color:var(--text-dim);
  font-family:var(--font-mono);
}
.crumb b{ color:var(--paper); font-weight:600; }

.content{
  max-width:760px;
  margin:0 auto;
  padding:40px 28px 100px;
}
.lesson-eyebrow{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--amber);
  margin-bottom:10px;
}
.lesson-title{
  font-family:var(--font-serif);
  font-size:34px;
  line-height:1.15;
  color:var(--paper);
  margin:0 0 14px;
  max-width:22ch;
}
.lesson-meta{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:24px;
}
.meta-pill{
  font-family:var(--font-mono);
  font-size:11px;
  padding:4px 11px;
  border-radius:20px;
  border:1px solid var(--line);
  color:var(--text-dim);
}
.meta-pill.level{ color:var(--amber); border-color:var(--amber-dim); }
.lesson-body{
  font-family:var(--font-serif);
  font-size:17px;
  line-height:1.7;
  color:var(--text);
  max-width:66ch;
}
.lesson-body p{ margin:0 0 16px; }
.lesson-body code{
  font-family:var(--font-mono);
  background:var(--panel-2);
  padding:2px 6px;
  border-radius:4px;
  font-size:0.86em;
  color:var(--teal);
}
.lesson-body ul{ margin:0 0 16px; padding-left:22px; }
.lesson-body li{ margin-bottom:8px; }

.code-block{
  margin:22px 0;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  background:#0f1116;
}
.code-block-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 14px;
  background:var(--panel-2);
  border-bottom:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:11.5px;
  color:var(--text-dim);
}
.code-block pre{
  margin:0;
  padding:16px;
  overflow-x:auto;
  font-family:var(--font-mono);
  font-size:13.5px;
  line-height:1.6;
  color:#dcdfe4;
}
.copy-btn{
  background:none; border:none; color:var(--text-dim);
  font-family:var(--font-mono); font-size:11px; cursor:pointer;
}
.copy-btn:hover{ color:var(--amber); }

/* playground */
.playground{
  margin:30px 0;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}
.pg-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px;
  background:var(--panel-2);
  border-bottom:1px solid var(--line);
}
.pg-label{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--paper);
  display:flex; align-items:center; gap:8px;
}
.pg-label::before{
  content:'';
  width:7px; height:7px; border-radius:50%;
  background:var(--amber);
  display:inline-block;
}
.run-btn{
  background:var(--amber);
  color:#1a1305;
  border:none;
  font-family:var(--font-ui);
  font-weight:600;
  font-size:12.5px;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
}
.run-btn:hover{ background:#f0c268; }
.pg-body{
  display:grid;
  grid-template-columns:1fr 1fr;
}
@media (max-width:640px){ .pg-body{ grid-template-columns:1fr; } }
.pg-editor{
  border-right:1px solid var(--line);
}
@media (max-width:640px){ .pg-editor{ border-right:none; border-bottom:1px solid var(--line); } }
.pg-editor textarea{
  width:100%;
  height:220px;
  background:#0f1116;
  color:#dcdfe4;
  border:none;
  padding:14px;
  font-family:var(--font-mono);
  font-size:13px;
  line-height:1.6;
  resize:vertical;
  outline:none;
}
.pg-output{
  background:#fff;
}
.pg-output iframe{
  width:100%;
  height:220px;
  border:none;
  display:block;
}
.pg-console{
  height:220px;
  overflow-y:auto;
  padding:14px;
  font-family:var(--font-mono);
  font-size:12.5px;
  background:#0b0d11;
  color:#8fd6c4;
  line-height:1.7;
}
.pg-console .err{ color:var(--red); }
.pg-console .arrow{ color:var(--text-dim); }

.callout{
  margin:22px 0;
  padding:14px 16px;
  border-left:3px solid var(--amber);
  background:rgba(232,180,76,0.07);
  border-radius:0 8px 8px 0;
  font-family:var(--font-ui);
  font-size:14.5px;
  color:var(--paper);
  line-height:1.6;
}
.callout b{ color:var(--amber); }

/* ---------- Quiz ---------- */
.quiz-section{
  margin:44px 0 10px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:var(--panel);
}
.quiz-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  background:var(--panel-2);
}
.quiz-eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--teal);
  margin-bottom:4px;
}
.quiz-title{
  font-family:var(--font-ui);
  font-size:16px;
  color:var(--paper);
  margin:0;
  font-weight:700;
}
.quiz-progress{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--text-dim);
  white-space:nowrap;
  flex-shrink:0;
}
#quizList{ padding:6px 20px 4px; }
.quiz-q{
  padding:18px 0;
  border-bottom:1px solid var(--line);
}
.quiz-q:last-child{ border-bottom:none; }
.quiz-q-text{
  font-family:var(--font-ui);
  font-size:14.5px;
  color:var(--paper);
  margin:0 0 12px;
  line-height:1.5;
  font-weight:600;
}
.quiz-options{
  display:flex; flex-direction:column; gap:8px;
}
.quiz-opt{
  text-align:left;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:13.5px;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
}
.quiz-opt:hover:not(:disabled){ border-color:var(--amber-dim); }
.quiz-opt{
  display:block;
  width:100%;
  min-height:42px;
  line-height:1.45;
  white-space:normal;
  word-break:break-word;
}
.quiz-opt:disabled{ cursor:default; }
.quiz-opt.correct{
  border-color:var(--teal);
  background:rgba(111,183,168,0.12);
  color:var(--teal);
  font-weight:700;
}
.quiz-opt.incorrect{
  border-color:var(--red);
  background:rgba(217,105,95,0.12);
  color:var(--red);
  font-weight:700;
}
.quiz-feedback{
  display:none;
  margin-top:10px;
  font-family:var(--font-ui);
  font-size:13px;
  line-height:1.6;
  padding:10px 12px;
  border-radius:8px;
}
.quiz-feedback.ok{ background:rgba(111,183,168,0.08); color:var(--teal); }
.quiz-feedback.bad{ background:rgba(217,105,95,0.08); color:var(--red); }
.quiz-question-retry{display:none;margin-top:10px;background:transparent;border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--font-ui);font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:7px;cursor:pointer}.quiz-question-retry:hover{background:rgba(232,180,76,0.08)}
.quiz-feedback b{ font-weight:700; }
.quiz-summary{
  display:none;
  align-items:center; justify-content:space-between;
  gap:14px;
  padding:16px 20px;
  background:var(--panel-2);
}
.quiz-summary-score{
  font-family:var(--font-ui);
  font-size:14px;
  font-weight:700;
  color:var(--paper);
}
.quiz-retry-btn{
  background:none;
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:12.5px;
  font-weight:600;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  flex-shrink:0;
}
.quiz-retry-btn:hover{ border-color:var(--amber-dim); color:var(--amber); }

.lesson-nav{
  display:flex;
  justify-content:space-between;
  gap:14px;
  margin-top:44px;
  padding-top:24px;
  border-top:1px solid var(--line);
}
.nav-btn{
  flex:1;
  max-width:280px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  padding:14px 16px;
  border-radius:10px;
  cursor:pointer;
  text-align:left;
  font-family:var(--font-ui);
}
.nav-btn:hover{ border-color:var(--amber-dim); }
.nav-btn.next{ margin-left:auto; text-align:right; }
.nav-btn-label{ font-size:11px; color:var(--text-dim); font-family:var(--font-mono); }
.nav-btn-title{ font-size:14px; margin-top:4px; color:var(--paper); font-weight:600; }
.nav-btn:disabled{ opacity:.3; cursor:default; }

.mark-done{
  display:inline-flex; align-items:center; gap:8px;
  margin-top:30px;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--text);
  padding:9px 16px;
  border-radius:8px;
  cursor:pointer;
  font-family:var(--font-ui);
  font-size:13.5px;
  font-weight:600;
}
.mark-done:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.mark-done.done{
  background:rgba(111,183,168,0.15);
  border-color:var(--teal);
  color:var(--teal);
}

/* Welcome screen */
.welcome{
  max-width:680px;
  margin:0 auto;
  padding:60px 28px 40px;
}
.welcome-eyebrow{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--amber);
  margin-bottom:14px;
}
.welcome h1{
  font-family:var(--font-serif);
  font-size:40px;
  color:var(--paper);
  margin:0 0 14px;
  line-height:1.15;
}
.welcome p{
  font-family:var(--font-serif);
  font-size:17px;
  line-height:1.7;
  color:var(--text-dim);
  max-width:56ch;
}
.stat-row{
  display:flex;
  gap:28px;
  margin-top:28px;
  padding-top:26px;
  border-top:1px solid var(--line);
}
.stat-item{ }
.stat-num{
  font-family:var(--font-mono);
  font-size:26px;
  font-weight:700;
  color:var(--paper);
}
.stat-label{
  font-family:var(--font-ui);
  font-size:12px;
  color:var(--text-dim);
  margin-top:2px;
}
.track-cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:32px;
}
@media (max-width:640px){ .track-cards{ grid-template-columns:1fr; } }
.track-card{
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  cursor:pointer;
  background:var(--panel);
}
.track-card:hover{ border-color:var(--amber-dim); }
.track-card-dot{
  width:10px; height:10px; border-radius:50%; margin-bottom:12px;
}
.track-card h3{
  font-family:var(--font-ui);
  font-size:15px;
  color:var(--paper);
  margin:0 0 6px;
}
.track-card p{
  font-family:var(--font-ui);
  font-size:12.5px;
  color:var(--text-dim);
  line-height:1.5;
  margin:0;
}

/* ======================= PROJECT AKHIR ======================= */
.project-card{border:1px solid #343a46;border-radius:18px;padding:28px;background:#191c23;margin-top:18px}
.project-hero{padding:30px;border-radius:18px;background:linear-gradient(135deg,#202631,#171a20);border:1px solid #343a46}
.project-hero h1{margin:8px 0 10px;font-size:clamp(28px,4vw,44px)}
.project-badge{display:inline-flex;padding:7px 12px;border-radius:999px;border:1px solid #d8a93d;color:#e8bf55;font-weight:700;font-size:12px}
.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.project-requirement{display:flex;gap:12px;align-items:flex-start;padding:15px;border:1px solid #303641;border-radius:12px;background:#1d2028}
.project-requirement input{margin-top:4px;accent-color:#67c9b5}
.project-requirement strong{display:block;margin-bottom:4px}
.project-form{display:grid;gap:12px;margin-top:18px}
.project-form label{font-weight:700;font-size:14px}
.project-form input[type=text]{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;border:1px solid #3a414e;background:#11141a;color:inherit}
.project-submit{border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;background:#67c9b5;color:#10151a}
.project-submit:disabled{opacity:.45;cursor:not-allowed}
.project-status{margin-top:18px;padding:18px;border-radius:14px;border:1px solid #3b806f;background:#182824}
.graduate-card{margin-top:22px;padding:30px;border-radius:18px;text-align:center;border:1px solid #d8a93d;background:#201e18}
.certificate{background:#fff;color:#1d2430;padding:48px 35px;border:12px double #b89435;border-radius:8px;margin-top:22px;text-align:center}
.certificate h2{font-size:34px;margin:10px 0}.certificate .student-name{font-size:28px;font-weight:800;margin:20px 0}.certificate .cert-meta{margin-top:20px;line-height:1.8}
.cert-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.cert-btn{padding:11px 16px;border-radius:9px;border:1px solid #555;background:#20242c;color:#fff;cursor:pointer}
.project-nav{margin:14px 10px 20px;padding:14px 15px;border:1px solid #3a414e;border-radius:12px;background:#1a1e25;cursor:pointer;color:inherit;text-align:left;width:calc(100% - 20px)}
.project-nav.locked{opacity:.55;cursor:not-allowed}.project-nav.done{border-color:#67c9b5}
@media(max-width:700px){.project-grid{grid-template-columns:1fr}.certificate{padding:30px 18px}.certificate h2{font-size:27px}.certificate .student-name{font-size:23px}}
</style>
</head>
<body>

<div class="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">kode<span>lab</span></div>
      <div class="brand-sub">HTML · CSS · JavaScript, dari nol</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Progres belajar</span>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="crumb" id="crumb">kodelab / beranda</div>
    </div>
    <div id="viewport"></div>
  </main>
</div>

<script>
/* ======================= DATA MATERI ======================= */
const TRACKS = [
  {
    "id": "html",
    "name": "HTML",
    "color": "#e8b44c",
    "desc": "Struktur, konten, formulir, dan semantic HTML.",
    "lessons": [
      {
        "id": "html-1",
        "title": "Apa itu HTML?",

function syncNavState(){
  document.querySelectorAll('.lesson-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === currentLessonId);
    el.classList.toggle('done', doneSet.has(el.dataset.id));
  });
  const total = allLessons.length;
  const done = doneSet.size;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = total ? `${(done/total)*100}%` : '0%';
  const projectBtn = document.querySelector('.project-nav');
  if(projectBtn){
    const unlocked = done >= total;
    const passed = localStorage.getItem('kodelab_project_passed') === 'true';
    projectBtn.classList.toggle('locked', !unlocked);
    projectBtn.classList.toggle('done', passed);
    projectBtn.innerHTML = `<b>${passed ? '🏆' : '💻'} Project Akhir</b><br><small>${passed ? 'Lulus & sertifikat tersedia' : unlocked ? 'Project kelulusan' : 'Selesaikan 47 materi terlebih dahulu'}</small>`;

}

    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')

function renderLesson(lesson){
  const idx = allLessons.findIndex(l => l.id === lesson.id);
  const prev = allLessons[idx-1];
  const next = allLessons[idx+1];

  crumb.innerHTML = `kodelab / <b>${lesson.trackName}</b> / ${lesson.title}`;

  viewport.innerHTML = `
    <div class="content">
      <div class="lesson-eyebrow" style="color:${lesson.trackColor}">${lesson.trackName}</div>
      <h1 class="lesson-title">${lesson.title}</h1>
      <div class="lesson-meta">
        <span class="meta-pill level">${lesson.level || 'Pemula'}</span>
        <span class="meta-pill">${lesson.duration || '3 menit'} baca</span>
      </div>
      <div class="lesson-body">
        ${lesson.body}
        <div class="code-block">
          <div class="code-block-head">
            <span>${lesson.code.lang}</span>
            <button class="copy-btn" data-copy>salin</button>
          </div>
          <pre><code>${escapeHtml(lesson.code.text)}</code></pre>
        </div>
        ${lesson.after || ''}
        ${lesson.callout ? `<div class="callout">${lesson.callout}</div>` : ''}
      </div>

      ${lesson.playground ? renderPlaygroundHtml(lesson) : ''}
      ${lesson.quiz && lesson.quiz.length ? renderQuizHtml(lesson) : ''}

      <button class="mark-done ${doneSet.has(lesson.id) ? 'done' : ''}" id="markDoneBtn"
        data-quiz-complete="${(!lesson.quiz || !lesson.quiz.length || doneSet.has(lesson.id) || quizScores[lesson.id]?.score === 100) ? 'true' : 'false'}"
        ${lesson.quiz && lesson.quiz.length && !doneSet.has(lesson.id) && quizScores[lesson.id]?.score !== 100 ? 'disabled title="Selesaikan semua soal kuis dengan benar terlebih dahulu"' : ''}>
        <span>${doneSet.has(lesson.id) ? '✓ Selesai dipelajari' : 'Tandai selesai'}</span>
      </button>

      <div class="lesson-nav">
        <button class="nav-btn prev" ${prev ? '' : 'disabled'}>
          <div class="nav-btn-label">← Sebelumnya</div>
          <div class="nav-btn-title">${prev ? prev.title : '—'}</div>
        </button>
        <button class="nav-btn next" ${(!next || !doneSet.has(lesson.id)) ? 'disabled' : ''}
          title="${next && !doneSet.has(lesson.id) ? 'Tandai materi ini selesai terlebih dahulu' : ''}">
          <div class="nav-btn-label">Selanjutnya →</div>
          <div class="nav-btn-title">${next ? next.title : '—'}</div>
        </button>
      </div>
    </div>
  `;

  // copy button
  const copyBtn = viewport.querySelector('[data-copy]');
  if (copyBtn){
    copyBtn.addEventListener('click', async () => {
      const text = lesson.code.text;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const temp = document.createElement('textarea');
          temp.value = text;
          temp.style.position = 'fixed';
          temp.style.opacity = '0';
          document.body.appendChild(temp);
          temp.focus();
          temp.select();
          document.execCommand('copy');
          temp.remove();
        }
        copyBtn.textContent = 'tersalin!';
      } catch (err) {
        copyBtn.textContent = 'gagal menyalin';
        console.error('Gagal menyalin kode:', err);
      }
      setTimeout(() => copyBtn.textContent = 'salin', 1500);
    });
  }

  // mark done
  const markDoneBtn = document.getElementById('markDoneBtn');
  markDoneBtn.addEventListener('click', (e) => {
    // Jika materi memiliki kuis, siswa wajib menyelesaikan semua soal dengan benar.
    // Gunakan status tombol + skor tersimpan agar tidak ada kondisi tombol terlihat aktif
    // tetapi kliknya ditolak oleh pemeriksaan state yang berbeda.
    const quizComplete = !lesson.quiz || !lesson.quiz.length ||
      e.currentTarget.dataset.quizComplete === 'true' ||
      quizScores[lesson.id]?.score === 100 ||
      doneSet.has(lesson.id);
    if (!quizComplete) return;

    if (doneSet.has(lesson.id)) doneSet.delete(lesson.id);
    else doneSet.add(lesson.id);

    // Simpan progress agar materi yang sudah selesai tidak hilang saat halaman di-reload.
    localStorage.setItem('kodelab_done', JSON.stringify([...doneSet]));

    e.currentTarget.classList.toggle('done');
    e.currentTarget.querySelector('span').textContent = doneSet.has(lesson.id) ? '✓ Selesai dipelajari' : 'Tandai selesai';

    // Jika dibatalkan, wajib mengerjakan kuis lagi sebelum bisa menandai selesai.
    if (lesson.quiz && lesson.quiz.length && !doneSet.has(lesson.id)) {
      e.currentTarget.disabled = true;
      e.currentTarget.title = 'Selesaikan semua soal kuis dengan benar terlebih dahulu';
    }

    // Tombol "Selanjutnya" hanya aktif setelah materi ini benar-benar ditandai selesai.
    const nextBtn = viewport.querySelector('.nav-btn.next');
    if (nextBtn) {
      nextBtn.disabled = !next || !doneSet.has(lesson.id);
      nextBtn.title = (next && !doneSet.has(lesson.id))
        ? 'Tandai materi ini selesai terlebih dahulu'
        : '';
    }

    syncNavState();
  });

  // prev/next
  if (prev) viewport.querySelector('.nav-btn.prev').addEventListener('click', () => goToLesson(prev.id));
  if (next) viewport.querySelector('.nav-btn.next').addEventListener('click', () => goToLesson(next.id));

  if (lesson.playground) setupPlayground(lesson);
  if (lesson.quiz && lesson.quiz.length) setupQuiz(lesson);
}

  return `
    <div class="playground">

        <button class="run-btn" id="runBtn">Jalankan ▸</button>
      </div>
      <div class="pg-body">
        <div class="pg-editor">
          <textarea id="pgEditor" spellcheck="false">${escapeHtml(lesson.playground.starter)}</textarea>
        </div>
        ${isJs
          ? `<div class="pg-console" id="pgConsole"><span class="arrow">// output console.log akan muncul di sini</span></div>`
          : `<div class="pg-output"><iframe id="pgFrame" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>`
        }
      </div>
    </div>
  `;

function setupPlayground(lesson){
  const editor = document.getElementById('pgEditor');
  const runBtn = document.getElementById('runBtn');
  const isJs = lesson.playground.type === 'js';

  function run(){
    const code = editor.value;
    if (isJs){
      const consoleEl = document.getElementById('pgConsole');
      consoleEl.innerHTML = '';
      const logs = [];
      const fakeConsole = {
        log: (...args) => logs.push({type:'log', text: args.map(a => typeof a==='object' ? JSON.stringify(a) : String(a)).join(' ')})
      };
      try {
        const fn = new Function('console', code);
        fn(fakeConsole);
      } catch(err){
        logs.push({type:'err', text: err.message});
      }
      if (logs.length === 0){
        consoleEl.innerHTML = '<span class="arrow">// tidak ada output</span>';
      } else {
        consoleEl.innerHTML = logs.map(l => `<div class="${l.type==='err'?'err':''}">${l.type==='err' ? '✕ ' : '→ '}${escapeHtml(l.text)}</div>`).join('');
      }
    } else {
      const frame = document.getElementById('pgFrame');
      frame.srcdoc = code;
    }
  }

  runBtn.addEventListener('click', run);
  run();
}

/* ---------- Quiz rendering & logic ---------- */
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Quiz rendering & logic ----------
   Pilihan jawaban diacak setiap kali kuis dibuka/diulang.
   q.correct tetap menunjuk indeks jawaban benar pada data asli.
   Setiap pilihan yang dirender menyimpan original index melalui data-original-index.
*/
function quizItemsHtml(lesson){
  return lesson.quiz.map((q,i) => {
    const shuffled = shuffleArray(q.options.map((text, originalIndex) => ({
      text,
      originalIndex
    })));

    return `
      <div class="quiz-q" data-qi="${i}">
        <p class="quiz-q-text">${i+1}. ${escapeHtml(q.q)}</p>
        <div class="quiz-options">
          ${shuffled.map(item => `<button class="quiz-opt" type="button" data-original-index="${item.originalIndex}">${escapeHtml(item.text)}</button>`).join('')}
        </div>
        <div class="quiz-feedback"></div>
        <button class="quiz-question-retry" type="button">🔄 Coba lagi</button>
      </div>
    `;
  }).join('');
}

function renderQuizHtml(lesson){
  return `
    <div class="quiz-section">
      <div class="quiz-head">
        <div>
          <div class="quiz-eyebrow">Uji pemahaman</div>
          <h3 class="quiz-title">Sudah paham materi ini?</h3>
        </div>
        <div class="quiz-progress" id="quizProgress">0 / ${lesson.quiz.length} benar</div>
      </div>
      <div id="quizList">${quizItemsHtml(lesson)}</div>
      <div class="quiz-summary" id="quizSummary">
        <div class="quiz-summary-score" id="quizSummaryScore"></div>
        <button class="quiz-retry-btn" id="quizRetryBtn">Ulangi kuis</button>
      </div>
    </div>
  `;
}

function setupQuiz(lesson){
  const total = lesson.quiz.length;
  const progressKey = `kodelab_quiz_progress_${lesson.id}`;
  let answered = {};

  // Pulihkan soal yang sebelumnya sudah dijawab BENAR.
  try {
    const saved = JSON.parse(localStorage.getItem(progressKey) || '[]');
    saved.forEach(qi => { answered[qi] = true; });
  } catch(e) {
    answered = {};
  }

  function saveProgress(){
    localStorage.setItem(progressKey, JSON.stringify(Object.keys(answered).map(Number)));
  }

  function updateProgress(){
    const doneCount = Object.keys(answered).length;
    const progressEl = document.getElementById('quizProgress');
    if (progressEl) progressEl.textContent = `${doneCount} / ${total} benar`;

    const quizComplete = doneCount >= total;
    const markDoneBtn = document.getElementById('markDoneBtn');

    // PENTING: tombol Tandai selesai hanya aktif setelah SEMUA soal benar.
    if (markDoneBtn) {
      markDoneBtn.dataset.quizComplete = quizComplete ? 'true' : 'false';
      markDoneBtn.disabled = !quizComplete && !doneSet.has(lesson.id);
      markDoneBtn.title = quizComplete
        ? 'Semua soal benar. Klik untuk menandai materi selesai.'
        : 'Selesaikan semua soal kuis dengan benar terlebih dahulu';
    }

    // Selanjutnya hanya aktif setelah Tandai selesai benar-benar ditekan.
    const nextBtn = viewport.querySelector('.nav-btn.next');
    if (nextBtn) {
      const unlocked = !!next && doneSet.has(lesson.id);
      nextBtn.disabled = !unlocked;
      nextBtn.title = (next && !unlocked)
        ? 'Tandai materi ini selesai terlebih dahulu'
        : '';
    }

    // Jika semua soal benar, simpan skor 100.
    if (quizComplete) {
      quizScores[lesson.id] = {
        correct: total,
        total,
        score: 100,
        at: new Date().toISOString()
      };
      localStorage.setItem('kodelab_quiz_scores', JSON.stringify(quizScores));
    }

    const summary = document.getElementById('quizSummary');
    if (summary) {
      summary.style.display = quizComplete ? 'flex' : 'none';
      if (quizComplete) {
        summary.classList.add('show-flex');
        const scoreEl = document.getElementById('quizSummaryScore');
        if (scoreEl) scoreEl.textContent = `Semua soal benar: ${total} dari ${total}`;
      }
    }
  }

  function bindQuestions(){
    document.querySelectorAll('.quiz-q').forEach(qEl => {
      const qi = Number(qEl.dataset.qi);
      const q = lesson.quiz[qi];
      const opts = qEl.querySelectorAll('.quiz-opt');
      const feedback = qEl.querySelector('.quiz-feedback');
      const retryQuestionBtn = qEl.querySelector('.quiz-question-retry');

      function showCorrectState(){
        opts.forEach(o => {
          o.disabled = true;
          const oi = Number(o.dataset.originalIndex);
          o.classList.remove('correct','incorrect');
          if (oi === q.correct) o.classList.add('correct');
        });
        feedback.style.display = 'block';
        feedback.className = 'quiz-feedback ok';
        feedback.innerHTML = '<b>Benar.</b> ' + escapeHtml(q.explain);
        if (retryQuestionBtn) retryQuestionBtn.style.display = 'none';
      }

      // Tampilkan kembali jawaban benar jika siswa pernah menjawabnya sebelumnya.
      if (answered[qi] !== undefined) showCorrectState();

      opts.forEach(optEl => {
        optEl.addEventListener('click', () => {
          if (answered[qi] !== undefined) return;

          const originalIndex = Number(optEl.dataset.originalIndex);
          const correct = originalIndex === q.correct;

          opts.forEach(o => {
            o.disabled = true;
            o.classList.remove('correct','incorrect');
            const oi = Number(o.dataset.originalIndex);
            if (oi === q.correct) o.classList.add('correct');
            else if (o === optEl && !correct) o.classList.add('incorrect');
          });

          feedback.style.display = 'block';
          feedback.className = 'quiz-feedback ' + (correct ? 'ok' : 'bad');
          feedback.innerHTML = correct
            ? '<b>Benar.</b> ' + escapeHtml(q.explain)
            : '<b>Belum tepat.</b> Jawabanmu belum benar. Klik <b>🔄 Coba lagi</b> untuk menjawab soal ini kembali.';

          if (correct) {
            answered[qi] = true;
            saveProgress();
            if (retryQuestionBtn) retryQuestionBtn.style.display = 'none';
          } else {
            if (retryQuestionBtn) retryQuestionBtn.style.display = 'inline-flex';
          }

          updateProgress();
        });
      });

      if (retryQuestionBtn){
        retryQuestionBtn.addEventListener('click', () => {
          delete answered[qi];
          saveProgress();
          opts.forEach(o => {
            o.disabled = false;
            o.classList.remove('correct','incorrect');
          });
          feedback.style.display = 'none';
          feedback.className = 'quiz-feedback';
          feedback.innerHTML = '';
          retryQuestionBtn.style.display = 'none';
          updateProgress();
        });
      }
    });
  }

  bindQuestions();
  updateProgress();

  const retryBtn = document.getElementById('quizRetryBtn');
  if (retryBtn){
    retryBtn.addEventListener('click', () => {
      answered = {};
      localStorage.removeItem(progressKey);
      delete quizScores[lesson.id];
      localStorage.setItem('kodelab_quiz_scores', JSON.stringify(quizScores));

      document.getElementById('quizList').innerHTML = quizItemsHtml(lesson);
      document.getElementById('quizSummary').style.display = 'none';
      document.getElementById('quizProgress').textContent = `0 / ${total} benar`;

      bindQuestions();
      updateProgress();
    });
  }
}
/* ======================= MOBILE SIDEBAR ======================= */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
document.getElementById('menuBtn').addEventListener('click', () => {
  sidebar.classList.add('open');
  overlay.classList.add('show');
});
function closeSidebar(){
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}
overlay.addEventListener('click', closeSidebar);

/* ======================= INIT ======================= */
renderNav();
renderWelcome();
</script>
